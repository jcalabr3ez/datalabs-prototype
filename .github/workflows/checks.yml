# Repository checks: ledger freshness, injection sync, engine harness shape.
# Freshness also runs weekly so staleness surfaces without waiting for a PR.
name: Checks

on:
  pull_request: {}
  schedule:
    - cron: "23 10 * * 1" # Mondays 10:23 UTC
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: House style and cross-file consistency
        run: python3 scripts/check_style.py
      - name: Ledger freshness vs publisher cadence
        run: python3 scripts/check_freshness.py
      - name: Embedded copies in sync with canonical ledgers
        run: |
          python3 scripts/inject_data.py
          if ! git diff --quiet; then
            echo "::error::generated blocks out of sync; run python3 scripts/inject_data.py and commit"
            git diff --stat
            exit 1
          fi
      - name: Question-to-number contract and live jump hrefs
        run: python3 scripts/check_answers.py
      - name: Engine loads and shapes responses (no API key needed)
        run: node scripts/check_engine.mjs
      - name: Chart scales keep zero only when the series sits near it
        run: node scripts/check_chart_scale.mjs
      - name: Suite page payloads stay under the weight budget
        run: node scripts/check_page_payload.mjs
      - name: High-cadence files vs ledger vintages
        run: python3 scripts/check_latest_release.py
