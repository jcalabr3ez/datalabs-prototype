# Golden-question eval against the LIVE site's ask endpoint. The Anthropic
# key stays in Netlify, where it already lives; GitHub holds no secrets.
# Defaults to the public site. Override with a SITE_URL repo variable or
# the workflow_dispatch input. Catches prompt regressions before users do.
name: Engine eval

on:
  schedule:
    - cron: "41 11 * * 1" # Mondays 11:41 UTC
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site URL override (else the SITE_URL repo variable)"
        required: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run golden questions against the live endpoint
        env:
          SITE_URL: ${{ inputs.site_url || vars.SITE_URL || 'https://datalabsai.netlify.app' }}
        run: node scripts/eval_engine.mjs
