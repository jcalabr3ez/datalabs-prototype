# Golden-question eval. Prefer an in-process run against this checkout
# when ANTHROPIC_API_KEY is set (that tests the PR's ask.js). Otherwise
# POST to a live endpoint: the Netlify deploy preview on pull_request,
# or SITE_URL / production on schedule and workflow_dispatch.
# GitHub holds the optional key; Netlify still holds the production key.
# A scheduled run must not skip a password gate.
name: Engine eval

on:
  pull_request: {}
  schedule:
    - cron: "41 11 * * 1" # Mondays 11:41 UTC
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site URL override (else the SITE_URL repo variable)"
        required: false

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run golden questions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_STRICT: ${{ github.event_name == 'schedule' && '1' || '0' }}
          SITE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--datalabsai.netlify.app', github.event.number) || github.event.inputs.site_url || vars.SITE_URL || 'https://datalabsai.netlify.app' }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "eval target: in-process handler (PR checkout)"
            unset SITE_URL
          else
            echo "eval target: $SITE_URL"
          fi
          node scripts/eval_engine.mjs
