[build]
  publish = "."
  command = "python3 scripts/inject_data.py"
  functions = "netlify/functions"

# Keep the whole site out of search indexes (prototype, not for public discovery).
# noindex is what actually removes pages from results; deliberately no robots.txt
# Disallow, which would stop crawlers from fetching the page and seeing this.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
