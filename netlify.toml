[build]
  publish = "."
  command = "python3 scripts/inject_data.py"
  functions = "netlify/functions"

[functions]
  timeout = 26

# The public site is indexable. robots.txt Allow plus the absence of a
# site-wide noindex is what lets search engines list the catalog.
# Pension name-search shards stay out of results: they are gzip payloads.

# Serve search shards as raw gzip so the page can decompress once.
# If the CDN already decoded them, the page checks the magic bytes.
[[headers]]
  for = "/pensions/search/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex, nofollow"
